<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 3; rx: 14; }
      .module { fill: #eef2ff; stroke: #4338ca; stroke-width: 2.5; rx: 12; }
      .sensor { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.5; rx: 12; }
      .output { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; rx: 12; }
      .power { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.5; rx: 12; }
      .warn { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.5; rx: 12; }
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .h2 { font: 700 20px Arial, sans-serif; fill: #111827; }
      .txt { font: 16px Arial, sans-serif; fill: #1f2937; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .pin { font: 700 15px Arial, sans-serif; fill: #111827; }
      .wire { fill: none; stroke: #111827; stroke-width: 3; }
      .wire-red { fill: none; stroke: #dc2626; stroke-width: 3; }
      .wire-blue { fill: none; stroke: #2563eb; stroke-width: 3; }
      .wire-yellow { fill: none; stroke: #ca8a04; stroke-width: 3; }
      .wire-green { fill: none; stroke: #16a34a; stroke-width: 3; }
      .wire-gray { fill: none; stroke: #6b7280; stroke-width: 3; }
      .node { fill: #111827; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>
  <text class="title" x="50" y="55">OLAF - Esquematico eletrico do prototipo</text>
  <text class="txt" x="50" y="84">Ligacoes atuais do firmware: sensores, LEDs, buzzer e alimentacao comum.</text>

  <!-- ESP32 -->
  <rect class="box" x="520" y="150" width="360" height="560"/>
  <text class="title" x="640" y="195">ESP32-S3</text>
  <text class="small" x="615" y="220">Processamento local + Wi-Fi + MQTT</text>

  <!-- Pins left -->
  <rect class="module" x="535" y="270" width="150" height="46"/>
  <text class="pin" x="560" y="299">GPIO5</text>
  <text class="small" x="610" y="299">Porta</text>

  <rect class="module" x="535" y="350" width="150" height="46"/>
  <text class="pin" x="555" y="379">ADC1_CH3</text>
  <text class="small" x="635" y="379">NTC</text>

  <rect class="power" x="535" y="610" width="150" height="46"/>
  <text class="pin" x="575" y="639">GND</text>

  <!-- Pins right -->
  <rect class="module" x="715" y="270" width="150" height="46"/>
  <text class="pin" x="740" y="299">GPIO35</text>
  <text class="small" x="800" y="299">Porta</text>

  <rect class="module" x="715" y="350" width="150" height="46"/>
  <text class="pin" x="740" y="379">GPIO42</text>
  <text class="small" x="800" y="379">Temp</text>

  <rect class="module" x="715" y="430" width="150" height="46"/>
  <text class="pin" x="750" y="459">GPIO2</text>
  <text class="small" x="800" y="459">Rec</text>

  <rect class="module" x="715" y="510" width="150" height="46"/>
  <text class="pin" x="740" y="539">GPIO36</text>
  <text class="small" x="800" y="539">Buzzer</text>

  <rect class="power" x="715" y="610" width="150" height="46"/>
  <text class="pin" x="755" y="639">3.3 V</text>

  <!-- Door sensor -->
  <rect class="sensor" x="70" y="230" width="300" height="125"/>
  <text class="h2" x="110" y="265">Sensor de porta E18-D80NK</text>
  <text class="txt" x="105" y="297">OUT -> GPIO5</text>
  <text class="small" x="105" y="323">Usar conversor/divisor se OUT for 5 V</text>

  <path class="wire" d="M370 292 L535 292"/>
  <circle class="node" cx="535" cy="292" r="5"/>

  <!-- NTC divider -->
  <rect class="sensor" x="70" y="405" width="300" height="210"/>
  <text class="h2" x="116" y="440">Divisor NTC 10K</text>
  <text class="small" x="110" y="470">3.3 V -> resistor 10 kOhm -> ADC</text>
  <text class="small" x="110" y="494">ADC -> NTC 10K -> GND</text>
  <line class="wire-green" x1="215" y1="520" x2="215" y2="545"/>
  <rect x="195" y="545" width="40" height="22" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text class="small" x="248" y="562">10 kOhm</text>
  <line class="wire" x1="215" y1="567" x2="215" y2="585"/>
  <circle class="node" cx="215" cy="585" r="5"/>
  <path class="wire" d="M215 585 L535 373"/>
  <line class="wire" x1="215" y1="585" x2="215" y2="604"/>
  <path class="wire" d="M202 604 L228 604 M207 612 L223 612 M212 620 L218 620"/>
  <text class="small" x="240" y="608">NTC 10K para GND</text>

  <!-- LEDs -->
  <rect class="output" x="1030" y="220" width="300" height="390"/>
  <text class="h2" x="1104" y="255">LEDs de estado</text>

  <circle cx="1105" cy="305" r="18" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
  <text class="txt" x="1140" y="312">Vermelho: porta</text>
  <text class="small" x="1140" y="334">GPIO35 -> resistor -> LED -> GND</text>

  <circle cx="1105" cy="410" r="18" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3"/>
  <text class="txt" x="1140" y="417">Azul: temperatura</text>
  <text class="small" x="1140" y="439">GPIO42 -> resistor -> LED -> GND</text>

  <circle cx="1105" cy="515" r="18" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
  <text class="txt" x="1140" y="522">Amarelo: recuperacao</text>
  <text class="small" x="1140" y="544">GPIO2 -> resistor -> LED -> GND</text>

  <path class="wire-red" d="M865 292 L1030 305"/>
  <path class="wire-blue" d="M865 373 L1030 410"/>
  <path class="wire-yellow" d="M865 453 L1030 515"/>

  <!-- Buzzer -->
  <rect class="output" x="1030" y="660" width="300" height="130"/>
  <text class="h2" x="1122" y="697">Buzzer ativo</text>
  <text class="txt" x="1090" y="731">GPIO36 controla o buzzer</text>
  <text class="small" x="1080" y="758">Para 5 V ou maior corrente, usar transistor/MOSFET</text>
  <path class="wire" d="M865 533 L1010 533 L1010 725 L1030 725"/>

  <!-- Power/GND bus -->
  <rect class="power" x="70" y="690" width="300" height="120"/>
  <text class="h2" x="155" y="727">Alimentacao</text>
  <text class="txt" x="110" y="760">3.3 V para sinais do ESP32</text>
  <text class="txt" x="110" y="785">GND comum em todos os modulos</text>

  <path class="wire-green" d="M370 750 L715 633"/>
  <path class="wire-gray" d="M370 785 L535 633"/>

  <!-- Notes -->
  <rect class="warn" x="930" y="90" width="400" height="95"/>
  <text class="h2" x="965" y="125">Atencao</text>
  <text class="small" x="965" y="151">GPIO do ESP32 nao aceita 5 V.</text>
  <text class="small" x="965" y="171">Adaptar nivel do E18-D80NK se necessario.</text>

  <rect class="box" x="520" y="750" width="360" height="95"/>
  <text class="h2" x="565" y="785">Resumo dos alertas</text>
  <text class="small" x="550" y="812">Piscou vermelho: fechar porta.</text>
  <text class="small" x="550" y="832">Piscou azul: temperatura fora da faixa.</text>
</svg>
